[project]
name = "hbtsim"
version = "0.1.0"
description = "Hanbury Brown-Twiss intensity-interferometry simulation of binary stars (Beta Aurigae)"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.32",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gpu = ["jax[cuda12]>=0.4.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hbtsim"]
