[project]
name = "hbtsim"
version = "0.1.0"
description = "Hanbury Brown-Twiss intensity-interferometry simulation of bright binary stars"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.32",
    "numpy>=2.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
movie = ["matplotlib>=3.8"]
test = ["pytest>=8.0", "matplotlib>=3.8"]
gpu = ["jax[cuda12]>=0.4.32"]
sed = ["h5py>=3.10"]

[project.scripts]
hbtsim = "hbtsim.__main__:main"
hbtsim-movie = "hbtsim.cli:main"
hbtsim-g2spec = "hbtsim.g2spec:main"
hbtsim-snr = "hbtsim.snr_cli:main"
hbtsim-catalog = "hbtsim.catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: timing tests (deselect with -m 'not slow')"]
filterwarnings = [
    "ignore:.*anchored-blackbody magnitude extrapolated.*:UserWarning",
    "ignore:.*dead-time load.*:UserWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hbtsim", "hbtsim.catalog"]

[tool.setuptools.package-data]
hbtsim = ["configs/*/*.json"]
