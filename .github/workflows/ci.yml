name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU JAX)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Catalog validates from the installed package data
        run: hbtsim catalog validate
      - name: Tests (the NewEra-data tests skip without tables)
        run: python -m pytest -q -m "not slow"
